<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>WordSwoop — Phase 1 Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cinzel (per chat) - carved-stone/RPG-title font for World Map
         world names (WorldSelectScene.js drawWorldName()). Only the
         weight that scene actually uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" rel="stylesheet" />
    <style>
      /* #e8d3a8 must match src/config.js's LETTERBOX_BG_HEX - this is
         plain CSS in a static HTML file, so it can't import that JS
         constant directly; keep the two in sync by hand if it changes.
         This is deliberately NOT the same as the app's dark
         APP_BG_COLOR (used for in-game HUD bars) - this page-level
         background only shows in the thin letterbox strip outside the
         canvas on an aspect ratio getCanvasSize()'s clamp doesn't
         fully match, and per chat a light creamy tone reads as an
         intentional border there instead of a mismatched color. */
      html, body {
        margin: 0;
        padding: 0;
        background: #e8d3a8;
        overflow: hidden;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* This body previously had a
         padding: env(safe-area-inset-top/right/bottom/left) rule here, to
         keep content clear of notches/home-indicators on a normal
         full-screen mobile browser tab. On Android that padding is what
         was leaving a fixed-height purple gap above the wood top bar (and
         every other scene) even after MainActivity.java went fully
         immersive - the native side now hides the system bars entirely
         instead of just making them transparent, so there's no OS status
         bar height left to reserve room for; the CSS was reserving space
         for a bar that no longer exists. Removed rather than zeroed out,
         since a stale rule left in "just in case" is what caused this in
         the first place. If a genuine notch/cutout needs clearing later
         (a specific phone's camera punch-hole overlapping tappable UI),
         that's a targeted fix in the scene's own HUD layout, not a global
         body padding that reintroduces this same bug for every screen. */
      /* Full-viewport game root - no border/frame/box. The canvas keeps its
         fixed aspect ratio and scales via Phaser's FIT mode to the largest
         size that fits this box; any leftover space (aspect-ratio mismatch
         on unusually wide/narrow screens) is the same background colour as
         the game itself, so it reads as "full screen" rather than a boxed
         panel, on every phone/tablet/desktop size. */
      #game-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #e8d3a8;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-frame">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
