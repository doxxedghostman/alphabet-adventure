<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>WordSwoop — Phase 1 Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #241a3d;
        overflow: hidden;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Respect notches/home-indicators on full-screen mobile browsers */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* Full-viewport game root - no border/frame/box. The canvas keeps its
         fixed aspect ratio and scales via Phaser's FIT mode to the largest
         size that fits this box; any leftover space (aspect-ratio mismatch
         on unusually wide/narrow screens) is the same background colour as
         the game itself, so it reads as "full screen" rather than a boxed
         panel, on every phone/tablet/desktop size. */
      #game-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #241a3d;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-frame">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
